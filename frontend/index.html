<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Migration Factory - AI Cloud Migration</title>
  </head>
  <body>
    <canvas id="galaxy-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Galaxy background — runs immediately on load
      (function () {
        const canvas = document.getElementById('galaxy-canvas')
        if (!canvas) return
        const ctx = canvas.getContext('2d')
        let W, H, stars = [], nebulae = [], shooting = []

        function resize() {
          W = canvas.width = window.innerWidth
          H = canvas.height = window.innerHeight
        }

        function init() {
          stars = Array.from({ length: 220 }, () => ({
            x: Math.random() * W, y: Math.random() * H,
            r: Math.random() * 1.1 + 0.2,
            a: Math.random() * 0.8 + 0.2,
            tw: Math.random() * Math.PI * 2,
            ts: Math.random() * 0.015 + 0.005
          }))
          nebulae = [
            { x: W * 0.15, y: H * 0.2, r: 200, h: 220, a: 0.04 },
            { x: W * 0.8, y: H * 0.7, r: 160, h: 200, a: 0.035 },
            { x: W * 0.6, y: H * 0.15, r: 130, h: 260, a: 0.03 },
            { x: W * 0.3, y: H * 0.85, r: 110, h: 180, a: 0.025 },
          ]
        }

        function draw() {
          ctx.fillStyle = '#020818'
          ctx.fillRect(0, 0, W, H)

          nebulae.forEach(n => {
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r)
            g.addColorStop(0, `hsla(${n.h},70%,35%,${n.a})`)
            g.addColorStop(0.5, `hsla(${n.h},60%,25%,${n.a * 0.5})`)
            g.addColorStop(1, 'transparent')
            ctx.fillStyle = g
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill()
          })

          stars.forEach(s => {
            s.tw += s.ts
            const b = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(s.tw))
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2)
            ctx.fillStyle = `rgba(180,210,255,${b * s.a})`
            ctx.fill()
          })

          if (Math.random() < 0.005) {
            shooting.push({
              x: Math.random() * W * 0.6, y: Math.random() * H * 0.35,
              vx: 5 + Math.random() * 5, vy: 3 + Math.random() * 3,
              len: 60 + Math.random() * 60, a: 1
            })
          }
          shooting = shooting.filter(s => s.a > 0)
          shooting.forEach(s => {
            const g2 = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 8, s.y - s.vy * 8)
            g2.addColorStop(0, `rgba(255,255,255,${s.a})`)
            g2.addColorStop(1, 'transparent')
            ctx.beginPath(); ctx.moveTo(s.x, s.y)
            ctx.lineTo(s.x - s.vx * 10, s.y - s.vy * 10)
            ctx.strokeStyle = g2; ctx.lineWidth = 1.5; ctx.stroke()
            s.x += s.vx; s.y += s.vy; s.a -= 0.025
          })
          requestAnimationFrame(draw)
        }

        resize(); init(); draw()
        window.addEventListener('resize', () => { resize(); init() })
      })()
    </script>
  </body>
</html>
